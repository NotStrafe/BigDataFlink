services:
  postgres:
    image: postgres:16
    container_name: bigdata-postgres
    environment:
      POSTGRES_DB: pet_sales
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d pet_sales"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.7.2
    container_name: bigdata-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  jobmanager:
    image: flink:1.19.1-scala_2.12-java17
    container_name: bigdata-flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: pet-sales
      KAFKA_GROUP_ID: pet-sales-flink
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/pet_sales
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 1
    volumes:
      - ./target:/opt/flink/usrlib
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  taskmanager:
    image: flink:1.19.1-scala_2.12-java17
    container_name: bigdata-flink-taskmanager
    command: taskmanager
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: pet-sales
      KAFKA_GROUP_ID: pet-sales-flink
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/pet_sales
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
    depends_on:
      jobmanager:
        condition: service_started

  producer:
    build: ./producer
    container_name: bigdata-kafka-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: pet-sales
      CSV_DIR: /data
      SEND_DELAY_MS: 0
    volumes:
      - ./исходные данные:/data:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
